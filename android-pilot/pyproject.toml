[project]
name = "android-pilot"
version = "0.1.0"
description = "Serveur MCP pour piloter et optimiser un Samsung Galaxy S24 Ultra via ADB (sans root)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "pyyaml>=6", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
android-pilot = "android_pilot.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
